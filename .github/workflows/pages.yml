name: Publier MollyMine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verifier et preparer le jeu
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier la publication
        run: node --test
      - name: Preparer le jeu avec le commit exact
        run: node scripts/build.mjs
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Eviter de republier un ancien commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          latest_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" = "$BUILD_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Un commit plus recent existe : cette publication est ignoree.'
          fi
      - name: Verifier la configuration Pages
        if: steps.latest.outputs.current == 'true'
        uses: actions/configure-pages@v5
      - name: Publier
        if: steps.latest.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
